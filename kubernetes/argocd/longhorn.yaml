apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=false
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  project: default
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: v1.10.0
      helm:
        valueFiles:
        - $values/kubernetes/helm-tools/istio/gateway.values.yaml
    - repoURL: 'https://github.com/tibo43/lima-k8s-apps.git'
      targetRevision: feat/init-project
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system