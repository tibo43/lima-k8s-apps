---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: metallb-ip-pool
  namespace: kube-system
spec:
  addresses:
  - 192.168.100.1-192.168.100.254
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: metallb-l2-ad
  namespace: kube-system
spec:
  ipAddressPools:
  - metallb-ip-pool
